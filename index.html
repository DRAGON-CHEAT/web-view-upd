<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRAGON SHOW</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            height: 100vh;
            color: #fff;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: #0a1628 url("dragon_bg.png") center center / cover no-repeat fixed;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        .top-header {
            flex-shrink: 0;
            position: relative;
        }

        .top-bar {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 24px 8px;
            background:
                linear-gradient(180deg,
                    rgba(0, 110, 130, 0.55) 0%,
                    rgba(0, 65, 85, 0.72) 45%,
                    rgba(8, 35, 52, 0.88) 100%);
            box-shadow:
                inset 0 1px 0 rgba(120, 240, 255, 0.35),
                inset 0 -4px 14px rgba(0, 180, 210, 0.1),
                0 2px 12px rgba(0, 0, 0, 0.35);
        }

        .top-glow-down {
            position: relative;
            height: 22px;
            pointer-events: none;
            background: linear-gradient(180deg,
                rgba(120, 248, 255, 0.45) 0%,
                rgba(0, 229, 255, 0.2) 22%,
                rgba(0, 200, 230, 0.07) 55%,
                transparent 100%);
        }

        .top-glow-down::before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            height: 2px;
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(125, 244, 255, 0.4) 8%,
                #7df4ff 22%,
                #00e5ff 50%,
                #7df4ff 78%,
                rgba(125, 244, 255, 0.4) 92%,
                transparent 100%);
            box-shadow:
                0 0 8px rgba(125, 244, 255, 1),
                0 0 16px rgba(0, 229, 255, 0.75),
                0 0 28px rgba(0, 229, 255, 0.35),
                0 2px 10px rgba(0, 229, 255, 0.25);
        }

        .brand {
            margin: 0;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #fff;
        }

        .main-scroll {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .scroll-body {
            display: flex;
            flex-direction: column;
            min-height: 100%;
            box-sizing: border-box;
            padding: 4px 0 0;
        }

        .columns {
            display: flex;
            gap: 0;
            min-height: min-content;
            align-items: stretch;
            padding: 0 16px;
        }

        .section {
            flex: 1;
            min-width: 0;
            padding: 12px var(--section-pad-x) 20px;
        }

        .section-divider {
            width: 2px;
            flex-shrink: 0;
            align-self: stretch;
            background: linear-gradient(180deg, transparent 0%, transparent 6%, rgba(0, 220, 255, 0.55) 18%, rgba(0, 220, 255, 0.55) 82%, transparent 100%);
            margin: 34px 0 20px;
        }

        .section-title {
            display: inline-block;
            margin: 0;
            padding: 4px 42px 6px;
            text-align: center;
            font-family: "Orbitron", "Arial Black", sans-serif;
            font-size: var(--section-title-size);
            font-weight: 800;
            color: #fff;
            letter-spacing: 1.5px;
            text-transform: none;
            line-height: 1.2;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.45);
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(0, 55, 120, 0.4) 5%,
                rgba(0, 123, 255, 0.78) 22%,
                rgba(0, 123, 255, 0.78) 78%,
                rgba(0, 55, 120, 0.4) 95%,
                transparent 100%);
        }

        .section-head {
            display: flex;
            justify-content: center;
            margin-bottom: 16px;
        }

        :root {
            --card-cols: 2;
            --card-gap: 14px;
            --box-pad-y: 12px;
            --box-pad-x: 10px;
            --card-title-size: 14px;
            --btn-size: 12px;
            --btn-pad-y: 9px;
            --section-title-size: 20px;
            --section-pad-x: 14px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(var(--card-cols), minmax(0, 1fr));
            gap: var(--card-gap);
        }

        .box {
            position: relative;
            overflow: hidden;
            background-color: rgba(18, 28, 42, 0.92);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border: 2px solid rgba(255, 255, 255, 0.12);
            border-radius: clamp(12px, 1.5vw, 18px);
            padding: var(--box-pad-y) var(--box-pad-x) calc(var(--box-pad-y) + 2px);
            text-align: center;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        .box::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(180deg,
                rgba(6, 14, 26, 0.35) 0%,
                rgba(6, 14, 26, 0.82) 55%,
                rgba(6, 14, 26, 0.92) 100%);
            pointer-events: none;
            z-index: 0;
        }

        .box > * {
            position: relative;
            z-index: 1;
        }

        .section[aria-label="For Android"] .box {
            background-image: url("https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=640&q=80");
        }

        .section[aria-label="For Android Tv"] .box {
            background-image: url("https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=640&q=80");
        }

        .box:focus,
        .box:focus-within {
            border-color: #00b4ff;
            transform: scale(1.03);
            outline: none;
            box-shadow: 0 0 18px rgba(0, 180, 255, 0.35);
        }

        .title-wrapper {
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(0, 180, 255, 0.25);
        }

        .title-wrapper h2 {
            display: block;
            width: 100%;
            margin: 0;
            padding: 6px 8px 7px;
            font-size: var(--card-title-size);
            font-weight: 700;
            color: #4db8ff;
            line-height: 1.3;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.55);
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(0, 55, 120, 0.42) 2%,
                rgba(0, 95, 115, 0.78) 14%,
                rgba(0, 95, 115, 0.78) 86%,
                rgba(0, 55, 120, 0.42) 98%,
                transparent 100%);
        }

        .btn-group {
            padding: 0 4px;
            display: flex;
            flex-wrap: wrap;
            gap: 0 6px;
        }

        .btn {
            background: #007bff;
            color: #fff;
            border: none;
            padding: var(--btn-pad-y) 8px;
            border-radius: 12px;
            font-size: var(--btn-size);
            cursor: pointer;
            margin: 0 0 8px;
            width: 100%;
            font-weight: 700;
        }

        .btn-clean {
            background: #3a3f47;
            color: #e8e8e8;
            font-size: calc(var(--btn-size) - 1px);
            margin-bottom: 0;
        }

        .btn:focus {
            background: #0056b3;
            outline: 2px solid #fff;
        }

        .btn-clean:focus { background: #555b65; }

        .btn-cancel {
            display: none;
            background: #8b2e2e;
            color: #fff;
            width: calc(50% - 3px);
            margin-bottom: 8px;
        }

        .btn-dl { width: 100%; }

        .box-downloading .btn-dl {
            width: calc(50% - 3px);
        }

        .box-downloading .btn-cancel {
            display: inline-block;
        }

        .btn-cancel:focus { background: #a83232; }

        .progress-container {
            width: 100%;
            background: #333;
            height: 18px;
            border-radius: 10px;
            margin: 12px auto 0;
            display: none;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #007bff, #00d4ff);
            transition: width 0.2s ease;
        }

        .timer-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 11px;
            font-weight: bold;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            z-index: 2;
        }

        .footer {
            flex-shrink: 0;
            margin-top: auto;
            text-align: center;
            padding: 40px 12px max(28px, env(safe-area-inset-bottom, 28px));
            color: #888;
            font-size: 12px;
            letter-spacing: 1px;
            font-weight: bold;
        }

        /* ØªÙ„ÙØ§Ø²: Ø´Ø¨ÙƒØ© ÙƒÙ…Ø§ ÙƒØ§Ù†Øª â€” Ù„Ø§ ØªØªØ£Ø«Ø± Ø¨Ø¥Ø¹Ø¯Ø§Ø¯Ø§Øª Ø§Ù„Ù…ÙˆØ¨Ø§ÙŠÙ„ */
        @media (min-width: 901px) {
            body {
                height: 100vh;
            }
            .cards-grid {
                display: grid;

        @media (max-width: 1023px) {

            }

        /* موبايل */
        @media (max-width: 640px) {

        /* Ø§Ø±ØªÙØ§Ø¹ Ù‚ØµÙŠØ± (Ù…ÙˆØ¨Ø§ÙŠÙ„ Ø£ÙÙ‚ÙŠ / Ø´Ø§Ø´Ø§Øª Ù…Ù†Ø®ÙØ¶Ø©) */

            }
            .section-head { margin-bottom: 10px; }

        /* ØªÙ„ÙØ§Ø² Ø¨Ø¹Ø±Ø¶ ÙƒØ¨ÙŠØ± ÙˆÙ‚Ø³Ù…ÙŠÙ† Ø¬Ù†Ø¨ Ø¨Ø¹Ø¶ */

    <script>
        let progressPollers = new Map();
        let activeDownloadBox = null;

        function initDownloadBoxes() {
            document.querySelectorAll(".section").forEach(function (section) {
                var key = section.getAttribute("aria-label") === "For Android Tv" ? "tv" : "android";
                section.querySelectorAll(".cards-grid .box").forEach(function (box, index) {
                    box.setAttribute("data-dl-key", "apps-" + key + "-" + index);
                    var downloadBtn = box.querySelector(".btn-group .btn:not(.btn-clean):not(.btn-cancel)");
                    if (downloadBtn) {
                        downloadBtn.classList.add("btn-dl");
                        var onclick = downloadBtn.getAttribute("onclick") || "";
                        var match = onclick.match(/startAction\(this,\s*'([^']+)'\)/);
                        var link = match ? match[1] : "";
                        if (link) {
                            downloadBtn.onclick = function () {
                                startAction(downloadBtn, link);
                            };
                        }
                    }
                    var cancelBtn = box.querySelector(".btn-cancel");
                    if (!cancelBtn && downloadBtn) {
                        cancelBtn = document.createElement("button");
                        cancelBtn.type = "button";
                        cancelBtn.className = "btn btn-cancel";
                        cancelBtn.innerText = "الغاء التحميل";
                        downloadBtn.insertAdjacentElement("afterend", cancelBtn);
                    }
                    if (cancelBtn) {
                        cancelBtn.onclick = function () {
                            cancelAction(cancelBtn);
                        };
                    }
                });
            });
        }

        function applyProgressToBox(box, value) {
            if (!box) return;
            var last = parseInt(box.getAttribute("data-dl-progress") || "0", 10);
            if (value < last) value = last;
            box.setAttribute("data-dl-progress", String(value));
            var progressCont = box.querySelector(".progress-container");
            var progressBar = box.querySelector(".progress-bar");
            var progressLabel = box.querySelector(".timer-text");
            if (progressCont) progressCont.style.display = "block";
            if (progressBar) progressBar.style.width = value + "%";
            if (progressLabel) progressLabel.innerText = value + "%";
        }

        window.setDownloadProgress = function (percent, boxKey) {
            var raw = Math.max(0, Math.min(100, parseInt(percent, 10) || 0));
            var value = Math.floor(raw / 5) * 5;
            if (raw > 0 && value === 0) value = 5;
            if (raw >= 100) value = 100;
            var box = null;
            if (boxKey) {
                box = document.querySelector('.box[data-dl-key="' + boxKey + '"]');
            }
            if (!box && activeDownloadBox) {
                box = activeDownloadBox;
            }
            if (!box) {
                box = document.querySelector(".box.box-downloading");
            }
            if (!box) return;
            if (!box.classList.contains("box-downloading")) return;
            applyProgressToBox(box, value);
        };
        let tvInsideBox = false;
        let tvActiveBox = null;

        function isMobileView() {
            return window.matchMedia("(max-width: 900px)").matches;
        }

        function isTvView() {
            return !isMobileView();
        }

        function scrollFocusIntoView(el) {
            if (!el) return;
            if (isMobileView()) {
                el.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
                return;
            }
            var root = document.querySelector(".main-scroll");
            if (!root) {
                el.scrollIntoView({ behavior: "smooth", block: "center", inline: "nearest" });
                return;
            }
            var pad = 20;
            var er = el.getBoundingClientRect();
            var sr = root.getBoundingClientRect();
            if (er.top < sr.top + pad) {
                root.scrollTop -= (sr.top + pad - er.top);
            } else if (er.bottom > sr.bottom - pad) {
                root.scrollTop += (er.bottom - sr.bottom + pad);
            }
            updateTvSectionHeads();
        }

        function updateTvSectionHeads() {
            if (!isTvView()) {
                document.querySelectorAll(".section-head").forEach(function (head) {
                    head.classList.remove("tv-hidden");
                });
                return;
            }
            var root = document.querySelector(".main-scroll");
            if (!root) return;
            var rootTop = root.getBoundingClientRect().top;
            document.querySelectorAll(".section").forEach(function (section) {
                var head = section.querySelector(".section-head");
                var firstBox = section.querySelector(".box");
                if (!head || !firstBox) return;
                if (firstBox.getBoundingClientRect().top <= rootTop + 10) {
                    head.classList.add("tv-hidden");
                } else {
                    head.classList.remove("tv-hidden");
                }
            });
        }

        function setupTvFocusables() {
            document.querySelectorAll(".box .btn").forEach(function (btn) {
                btn.tabIndex = isTvView() ? -1 : 0;
            });
        }

        function elementCenter(el) {
            var r = el.getBoundingClientRect();
            return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
        }

        function getFocusBox() {
            var el = document.activeElement;
            if (!el) return null;
            return el.classList.contains("box") ? el : el.closest(".box");
        }

        function getTvBoxLevelTargets() {
            return Array.prototype.slice.call(document.querySelectorAll(".cards-grid .box"));
        }

        function moveSpatialFocus(direction, targets, current) {
            if (!current) return false;
            var cc = elementCenter(current);
            var best = null;
            var bestScore = Infinity;

            targets.forEach(function (el) {
                if (el === current) return;
                var ec = elementCenter(el);
                var dx = ec.x - cc.x;
                var dy = ec.y - cc.y;
                var ok = false;
                if (direction === "left" && dx < -24) ok = true;
                if (direction === "right" && dx > 24) ok = true;
                if (direction === "up" && dy < -24) ok = true;
                if (direction === "down" && dy > 24) ok = true;
                if (!ok) return;
                var primary = (direction === "left" || direction === "right") ? Math.abs(dx) : Math.abs(dy);
                var secondary = (direction === "left" || direction === "right") ? Math.abs(dy) : Math.abs(dx);
                var score = primary + secondary * 1.5;
                if (score < bestScore) {
                    bestScore = score;
                    best = el;
                }
            });

            if (best) {
                best.focus();
                scrollFocusIntoView(best);
                return true;
            }
            return false;
        }

        function enterTvBox(box) {
            if (!box) return;
            tvInsideBox = true;
            tvActiveBox = box;
            box.classList.add("tv-inside");
            var btns = box.querySelectorAll(".btn");
            btns.forEach(function (btn) { btn.tabIndex = 0; });
            var firstBtn = box.querySelector(".btn");
            if (firstBtn) firstBtn.focus();
            scrollFocusIntoView(box);
        }

        function exitTvBox() {
            if (!tvInsideBox) return;
            tvInsideBox = false;
            document.querySelectorAll(".box .btn").forEach(function (btn) {
                if (isTvView()) btn.tabIndex = -1;
            });
            if (tvActiveBox) {
                tvActiveBox.classList.remove("tv-inside");
                tvActiveBox.focus();
                scrollFocusIntoView(tvActiveBox);
            }
        }

        function isBackKey(e) {
            return e.key === "Escape" || e.key === "Backspace" || e.keyCode === 4;
        }

        function isEnterKey(e) {
            return e.key === "Enter" || e.keyCode === 13 || e.keyCode === 23;
        }

        function handleTvKeydown(e) {
            if (isMobileView()) return;

            if (isBackKey(e)) {
                if (tvInsideBox) {
                    exitTvBox();
                    e.preventDefault();
                }
                return;
            }

            if (isEnterKey(e) && !tvInsideBox) {
                var active = document.activeElement;
                if (active && active.classList.contains("box")) {
                    enterTvBox(active);
                    e.preventDefault();
                    return;
                }
            }

            var dirMap = {
                ArrowLeft: "left",
                ArrowRight: "right",
                ArrowUp: "up",
                ArrowDown: "down"
            };
            var dir = dirMap[e.key];
            if (!dir) return;

            if (tvInsideBox) {
                var box = tvActiveBox || getFocusBox();
                var active = document.activeElement;
                if (!box) return;

                if (dir === "left" || dir === "right") {
                    exitTvBox();
                    e.preventDefault();
                    return;
                }

                if (active && active.classList.contains("btn")) {
                    var btns = Array.prototype.slice.call(box.querySelectorAll(".btn"));
                    var btnIndex = btns.indexOf(active);
                    if (dir === "down" && btnIndex < btns.length - 1) {
                        btns[btnIndex + 1].focus();
                        scrollFocusIntoView(box);
                        e.preventDefault();
                        return;
                    }
                    if (dir === "up" && btnIndex > 0) {
                        btns[btnIndex - 1].focus();
                        scrollFocusIntoView(box);
                        e.preventDefault();
                        return;
                    }
                }
                return;
            }

            var activeEl = document.activeElement;
            if (activeEl && activeEl.classList.contains("btn")) {
                activeEl = activeEl.closest(".box") || activeEl;
            }
            if (activeEl && !getTvBoxLevelTargets().includes(activeEl)) {
                activeEl = getFocusBox() || activeEl;
            }

            if (moveSpatialFocus(dir, getTvBoxLevelTargets(), activeEl)) {
                e.preventDefault();
            }
        }

        function cancelAction(btnElement) {
            var parentBox = btnElement.closest(".box");
            if (!parentBox) return;
            var boxKey = parentBox.getAttribute("data-dl-key") || "";

            if (progressPollers.has(parentBox)) {
                clearInterval(progressPollers.get(parentBox));
                progressPollers.delete(parentBox);
            }

            parentBox.classList.remove("box-downloading");
            parentBox.removeAttribute("data-dl-progress");

            var progressCont = parentBox.querySelector(".progress-container");
            var progressBar = parentBox.querySelector(".progress-bar");
            var progressLabel = parentBox.querySelector(".timer-text");
            var dlBtn = parentBox.querySelector(".btn-dl");

            if (progressCont) progressCont.style.display = "none";
            if (progressBar) progressBar.style.width = "0%";
            if (progressLabel) progressLabel.innerText = "0%";
            if (dlBtn) dlBtn.innerText = "تحميل التطبيق";

            if (activeDownloadBox === parentBox) {
                activeDownloadBox = null;
            }

            if (window.Android && window.Android.cancelBoxDownload) {
                window.Android.cancelBoxDownload(boxKey);
            }
        }

        function startAction(btnElement, url) {
            var parentBox = btnElement.closest(".box");
            var progressCont = parentBox.querySelector(".progress-container");
            var progressBar = parentBox.querySelector(".progress-bar");
            var progressLabel = parentBox.querySelector(".timer-text");

            if (progressPollers.has(parentBox)) {
                clearInterval(progressPollers.get(parentBox));
                progressPollers.delete(parentBox);
            }

            parentBox.classList.add("box-downloading");
            activeDownloadBox = parentBox;

            progressCont.style.display = "block";
            btnElement.innerText = "إعادة التحميل !";
            if (progressBar) progressBar.style.width = "0%";
            if (progressLabel) progressLabel.innerText = "0%";
            parentBox.setAttribute("data-dl-progress", "0");

            if (window.Android && window.Android.triggerDownload) {
                var boxKey = parentBox.getAttribute("data-dl-key") || "";
                window.Android.triggerDownload(url, boxKey);
                var pollFn = window.Android.getDownloadProgressForBox || window.Android.getDownloadProgress;
                if (pollFn) {
                    var pollId = setInterval(function () {
                        var pct = pollFn.call(window.Android, boxKey);
                        window.setDownloadProgress(pct, boxKey);
                        if (pct >= 100) {
                            clearInterval(pollId);
                            progressPollers.delete(parentBox);
                        }
                    }, 250);
                    progressPollers.set(parentBox, pollId);
                }
            }
        }

        function resetBox(boxElement) {
            document.querySelectorAll(".box").forEach(function (box) {
                if (box !== boxElement && !box.classList.contains("box-downloading")) {
                    var progressCont = box.querySelector(".progress-container");
                    var btn = box.querySelector(".btn-dl");
                    var progressLabel = box.querySelector(".timer-text");
                    var progressBar = box.querySelector(".progress-bar");

                    if (progressCont) progressCont.style.display = "none";
                    if (btn && btn.innerText === "إعادة التحميل !") btn.innerText = "تحميل التطبيق";

                    if (progressPollers.has(box)) {
                        clearInterval(progressPollers.get(box));
                        progressPollers.delete(box);
                    }
                    if (progressLabel) progressLabel.innerText = "0%";
                    if (progressBar) progressBar.style.width = "0%";
                    box.removeAttribute("data-dl-progress");
                }
            });

            if (window.matchMedia("(max-width: 900px)").matches) {
                boxElement.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
            } else {
                scrollFocusIntoView(boxElement);
            }
        }

        setupTvFocusables();
        initDownloadBoxes();

        document.addEventListener("visibilitychange", function () {
            if (document.hidden && window.Android && window.Android.deleteOldApk) {
                window.Android.deleteOldApk();
            }
        });

        window.addEventListener("resize", function () {
            if (tvInsideBox && !isTvView()) {
                tvInsideBox = false;
                tvActiveBox = null;
                document.querySelectorAll(".box").forEach(function (box) {
                    box.classList.remove("tv-inside");
                });
            }
            setupTvFocusables();
            updateTvSectionHeads();
        });
        document.addEventListener("keydown", handleTvKeydown);

        var mainScrollEl = document.querySelector(".main-scroll");
        if (mainScrollEl) {
            mainScrollEl.addEventListener("scroll", updateTvSectionHeads);
        }

        window.addEventListener("load", function () {
            setupTvFocusables();
            updateTvSectionHeads();
            if (isTvView()) {
                var firstBox = document.querySelector(".cards-grid .box");
                if (firstBox) firstBox.focus();
            }
        });

        document.querySelector(".main-scroll").addEventListener("focusin", function (e) {
            var box = e.target.closest ? e.target.closest(".box") : null;
            if (!box) return;
            if (isTvView() && !tvInsideBox) {
                scrollFocusIntoView(box);
            } else if (isMobileView()) {
                scrollFocusIntoView(box);
            }
        });

        document.querySelectorAll(".cards-grid").forEach(function (grid) {
            grid.addEventListener("wheel", function (e) {
                if (!window.matchMedia("(max-width: 900px)").matches) return;
                if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
                grid.scrollLeft += e.deltaY;
                e.preventDefault();
            }, { passive: false });
        });
    </script>
</body>
</html>
